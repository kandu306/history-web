<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="55%" stop-color="#2d1515"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative ornament, top-right -->
  <g opacity="0.10">
    <path d="M1050 40 L1160 130 L1160 310 L1050 400 L940 310 L940 130 Z" fill="#9b1c1c"/>
  </g>
  <!-- Decorative ornament, bottom-left -->
  <g opacity="0.06">
    <path d="M120 430 L230 500 L230 620 L120 690 L10 620 L10 500 Z" fill="#9b1c1c"/>
  </g>

  <!-- Diamond emblem -->
  <path d="M120 255 L170 305 L120 355 L70 305 Z" fill="#9b1c1c"/>
  <circle cx="120" cy="305" r="10" fill="#faf9f7"/>

  <text x="220" y="270" font-family="Georgia, 'Noto Serif', serif" font-size="30" fill="#a8a29e" letter-spacing="2">Khoá học phân tích nhân vật</text>
  <text x="220" y="345" font-family="Georgia, 'Noto Serif', serif" font-size="72" font-weight="700" fill="#faf9f7">Lịch Sử Việt Nam</text>
  <text x="220" y="400" font-family="Georgia, 'Noto Serif', serif" font-size="30" font-style="italic" fill="#d6d3d1">Hệ thống <tspan fill="#fca5a5">3 Gốc / 3 Độc</tspan></text>
</svg>
